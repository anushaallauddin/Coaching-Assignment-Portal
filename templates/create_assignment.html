<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Assignment</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body p-4">

            <h2 class="mb-4">
                Create Assignment
            </h2>


            {% if error %}

                <div class="alert alert-danger">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST">


                <!-- ASSIGN TO -->

                <div class="mb-3">

                    <label class="form-label">
                        Assign To
                    </label>

                    <select
                        name="student_id"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Student
                        </option>

                        <option value="all">
                            All Students
                        </option>

                        {% for student in students %}

                            <option value="{{ student.id }}">
                                {{ student.name }} ({{ student.student_code }})
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- TITLE -->

                <div class="mb-3">

                    <label class="form-label">
                        Assignment Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="Enter assignment title"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="5"
                        placeholder="Enter assignment instructions"
                        required
                    ></textarea>

                </div>


                <!-- DEADLINE -->

                <div class="mb-4">

                    <label class="form-label">
                        Deadline
                    </label>

                    <input
                        type="datetime-local"
                        name="deadline"
                        class="form-control"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Assignment
                </button>


                <a
                    href="{{ url_for('teacher_dashboard') }}"
                    class="btn btn-secondary"
                >
                    Back to Dashboard
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
